name: Container images

# Automated multi-architecture images for yetone/cumora.
#
# Upstream ships its production server Dockerfile at
# server/docker/cumora-server.Dockerfile (with a matching
# <Dockerfile>.dockerignore) and already builds it in its own CI, but pushes
# only to a private Google Artifact Registry. This repository republishes that
# image to Docker Hub and GHCR for linux/amd64 and linux/arm64, building with
# upstream's own Dockerfile so the image definition never drifts from upstream.
#
# Two kinds of images are tracked, and each carries only the tags that are true
# of it:
#
#   * main sync     -> `sha-<commit>` + `latest`
#   * release tag   -> `sha-<commit>` + `<version>` (from the upstream v* tag)
#
# A version tag is only ever attached to the exact commit the upstream release
# tag points at. `package.json` is deliberately NOT used as a version: on main
# it lags the released tag (main can sit at 0.18.7 while v0.18.8 is tagged
# later), so keying tags off it would publish a version tag for a commit that
# upstream never released.
#
# The image serves three surfaces from one Node process:
#   /api/*      JSON API
#   /runtime/*  agent runtime API (JWT-authed)
#   /*          the React SPA bundle
# It also ships `kubectl`, which the orchestrator uses to spawn per-agent
# pods. That path needs a Kubernetes cluster; without one the server still
# boots and serves the API + SPA. See docker-compose.yml.

on:
  schedule:
    # Every six hours: build only when a tracked commit has moved.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Build this upstream ref as the main sync (branch, tag, or SHA; empty = main HEAD)
        required: false
        type: string
      force_rebuild:
        description: Rebuild even when the tracked commits are already published
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One build at a time: `latest` must never be moved by an older commit
  # finishing after a newer one.
  group: cumora-image
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: yetone/cumora
  # Path to the upstream Dockerfile, relative to the checked-out upstream tree.
  UPSTREAM_DOCKERFILE: server/docker/cumora-server.Dockerfile
  IMAGE: cumora
  DOCKERHUB_NAMESPACE: czyt

jobs:
  resolve:
    name: Resolve upstream targets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      has_targets: ${{ steps.plan.outputs.has_targets }}
      targets: ${{ steps.plan.outputs.targets }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Plan the build targets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          set -euo pipefail

          repo="${UPSTREAM_REPOSITORY}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json'

          # Authenticate as an anonymous puller. The workflow token carries no
          # read:packages scope, so a plain Bearer request answers 403 for a
          # package that exists and would rebuild every run. The anonymous
          # token endpoint is scoped to `pull` only and works for a public
          # package.
          TOKEN="$(curl -fsS "https://ghcr.io/token?scope=repository:${owner}/${IMAGE}:pull&service=ghcr.io" | jq -r .token)"
          is_published() { # $1 = short sha
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: ${accept}" \
              "https://ghcr.io/v2/${owner}/${IMAGE}/manifests/sha-$1" || true)"
            [[ "${code}" == "200" ]]
          }

          # --- main sync: the upstream default-branch head -----------------
          # A manual dispatch may pin a different ref; that build is still the
          # "newest sync" for tagging purposes.
          ref="${REQUESTED_REF:-main}"
          main_sha="$(gh api "repos/${repo}/commits/${ref}" --jq .sha)"
          [[ "${main_sha}" =~ ^[0-9a-f]{40}$ ]]
          main_short="${main_sha:0:7}"

          # --- latest release: highest upstream vX.Y.Z tag -----------------
          # `releases/latest` is stale here (upstream stops creating GitHub
          # Releases past v0.9.0), so the tag list is the source of truth.
          latest_tag="$(gh api "repos/${repo}/tags?per_page=100" --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          [[ -n "${latest_tag}" ]]

          object="$(gh api "repos/${repo}/git/ref/tags/${latest_tag}" --jq '.object.type + " " + .object.sha')"
          read -r object_type object_sha <<<"${object}"
          if [[ "${object_type}" == "tag" ]]; then
            release_sha="$(gh api "repos/${repo}/git/tags/${object_sha}" --jq .object.sha)"
          elif [[ "${object_type}" == "commit" ]]; then
            release_sha="${object_sha}"
          else
            echo "Unsupported upstream tag object: ${object_type}" >&2
            exit 1
          fi
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]]
          release_short="${release_sha:0:7}"
          release_version="${latest_tag#v}"

          targets='[]'
          matrix='[]'

          # add_target NAME SHA SHORT VERSION TAGS_JSON
          add_target() {
            local name="$1" sha="$2" short="$3" version="$4" tags_json="$5"
            targets="$(jq -c --arg n "${name}" --arg sha "${sha}" --arg s "${short}" \
              --arg v "${version}" --argjson t "${tags_json}" \
              '. + [{name:$n,sha:$sha,short_sha:$s,version:$v,tags:$t}]' <<<"${targets}")"
            matrix="$(jq -c --arg n "${name}" --arg sha "${sha}" --arg s "${short}" --arg v "${version}" \
              '. + [
                {name:$n,sha:$sha,short_sha:$s,version:$v,runner:"ubuntu-24.04",platform:"linux/amd64",platform_tag:"amd64"},
                {name:$n,sha:$sha,short_sha:$s,version:$v,runner:"ubuntu-24.04-arm",platform:"linux/arm64",platform_tag:"arm64"}
              ]' <<<"${matrix}")"
          }

          wants() { # $1 = short sha
            [[ "${FORCE_REBUILD}" == "true" ]] || ! is_published "$1"
          }

          if [[ "${release_sha}" == "${main_sha}" ]]; then
            # The head IS the release commit: one image, every tag applies.
            if wants "${main_short}"; then
              add_target main "${main_sha}" "${main_short}" "${release_version}" \
                "$(jq -cn --arg a "sha-${main_short}" --arg b "${release_version}" --arg c latest '[$a,$b,$c]')"
            fi
          else
            if wants "${main_short}"; then
              add_target main "${main_sha}" "${main_short}" "" \
                "$(jq -cn --arg a "sha-${main_short}" --arg b latest '[$a,$b]')"
            fi
            if wants "${release_short}"; then
              add_target release "${release_sha}" "${release_short}" "${release_version}" \
                "$(jq -cn --arg a "sha-${release_short}" --arg b "${release_version}" '[$a,$b]')"
            fi
          fi

          has_targets=false
          if [[ "$(jq 'length' <<<"${targets}")" != "0" ]]; then
            has_targets=true
          fi

          {
            echo "has_targets=${has_targets}"
            echo "targets=$(jq -c . <<<"${targets}")"
            echo "matrix=$(jq -c . <<<"${matrix}")"
          } >>"${GITHUB_OUTPUT}"

          {
            echo "### Cumora build plan"
            echo
            echo "- main sync: \`${main_sha}\` (\`${main_short}\`)"
            echo "- latest release: \`${latest_tag}\` -> \`${release_sha}\`"
            echo "- builds required: \`${has_targets}\`"
            echo
            echo '```'
            jq -r '.[] | "\(.name)  \(.sha)  tags=\(.tags | join(","))"' <<<"${targets}" || true
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

  build:
    name: Build ${{ matrix.name }} ${{ matrix.platform }}
    needs: resolve
    if: needs.resolve.outputs.has_targets == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Native runners per architecture: the image runs a full `npm ci`
        # twice (runtime deps + SPA build), far slower under QEMU emulation
        # than on a native arm64 runner.
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      SHORT_SHA: ${{ matrix.short_sha }}
    steps:
      - name: Check out pinned upstream source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Verify upstream source and image definition
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -f "${UPSTREAM_DOCKERFILE}"
          test -f "${UPSTREAM_DOCKERFILE}.dockerignore"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.UPSTREAM_DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE }}:build-${{ env.SHORT_SHA }}-${{ env.BUILD_ID }}-${{ matrix.platform_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}:build-${{ env.SHORT_SHA }}-${{ env.BUILD_ID }}-${{ matrix.platform_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.UPSTREAM_REPOSITORY }}
            org.opencontainers.image.title=Cumora server
            org.opencontainers.image.description=Where agent teams gather - API, agent runtime and web client in one image
            org.opencontainers.image.version=${{ matrix.version || matrix.short_sha }}
            org.opencontainers.image.revision=${{ matrix.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=cumora-${{ matrix.platform_tag }}
          cache-to: type=gha,mode=max,scope=cumora-${{ matrix.platform_tag }}
          provenance: true
          sbom: true

  publish:
    name: Publish ${{ matrix.name }} manifests
    needs: [resolve, build]
    if: needs.resolve.outputs.has_targets == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.targets) }}
    env:
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      SHORT_SHA: ${{ matrix.short_sha }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify manifests
        env:
          TAGS: ${{ join(matrix.tags, ' ') }}
        run: |
          set -euo pipefail

          bases=(
            "docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE}"
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}"
          )
          read -ra tags <<<"${TAGS}"

          for base in "${bases[@]}"; do
            args=()
            for tag in "${tags[@]}"; do
              args+=(--tag "${base}:${tag}")
            done

            docker buildx imagetools create "${args[@]}" \
              "${base}:build-${SHORT_SHA}-${BUILD_ID}-amd64" \
              "${base}:build-${SHORT_SHA}-${BUILD_ID}-arm64"

            docker buildx imagetools inspect --raw "${base}:${tags[0]}" \
              | jq -e '
                  [.manifests[]?.platform
                    | select(.os == "linux")
                    | .architecture] as $architectures
                  | ($architectures | index("amd64")) != null
                    and ($architectures | index("arm64")) != null
                ' >/dev/null
          done

      - name: Make the GHCR package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Best effort. New GHCR packages inherit the org's visibility, so
          # this is usually a no-op; flipping it explicitly needs admin:org,
          # which the workflow token does not carry. Never fail the publish
          # for a cosmetic permission miss.
          if gh api --method PATCH \
               "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${IMAGE}" \
               -f visibility=public >/dev/null 2>&1; then
            echo "GHCR package visibility set to public"
          else
            echo "::notice::Could not set GHCR package visibility (needs admin:org); it stays at the org default"
          fi

      - name: Summary
        env:
          TAGS: ${{ join(matrix.tags, ' ') }}
          NAME: ${{ matrix.name }}
        run: |
          {
            echo "### Cumora ${NAME} image published"
            echo
            echo "- commit: \`${SHORT_SHA}\`"
            echo "- tags: \`${TAGS// /, }\`"
            echo "- platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo
            echo '```'
            echo "docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE}:${TAGS%% *}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}:${TAGS%% *}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

  keepalive:
    name: Keep the scheduled workflow active
    # GitHub disables a `schedule` trigger after 60 days without repository
    # activity. When there is nothing to build, commit a timestamp so the
    # six-hour check keeps running.
    needs: resolve
    if: needs.resolve.outputs.has_targets != 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out image repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh activity after 45 quiet days
        run: |
          set -euo pipefail

          now="$(date +%s)"
          last_commit="$(git log -1 --format=%ct)"
          age_days="$(( (now - last_commit) / 86400 ))"
          if (( age_days < 45 )); then
            echo "Last repository activity was ${age_days} days ago; no keepalive commit needed."
            exit 0
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/KEEPALIVE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/KEEPALIVE
          git commit -m "chore: keep scheduled image sync active [skip ci]"
          git push
